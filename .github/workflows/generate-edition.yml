name: Generate daily edition

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Generate edition with retries
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Edition generation attempt $attempt/5"
            if node scripts/generate-edition.mjs; then
              exit 0
            fi

            if [ "$attempt" -lt 5 ]; then
              delay=$((attempt * 30))
              echo "Attempt failed; retrying in ${delay}s"
              sleep "$delay"
            fi
          done

          echo "Edition generation failed after 5 attempts"
          exit 1
