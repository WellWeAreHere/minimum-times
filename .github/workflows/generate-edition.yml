name: Generate daily edition

on:
  schedule:
    - cron: "30 9 * * *"    # 3:00 PM IST
    - cron: "45 18 * * *"   # 12:15 AM IST
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci

      - name: Generate edition with retries
        shell: bash
        run: |
          delayed_rss_retry_used=false
          for attempt in 1 2 3 4 5; do
            echo "Edition generation attempt $attempt/5"
            set +e
            node scripts/generate-edition.mjs
            status=$?
            set -e

            if [ "$status" -eq 0 ]; then
              exit 0
            fi

            if [ "$attempt" -lt 5 ]; then
              if [ "$status" -eq 75 ] && [ "$delayed_rss_retry_used" = false ]; then
                delay=1200
                delayed_rss_retry_used=true
                echo "All Google News RSS feeds returned HTTP 503; retrying in 20 minutes"
              else
                delay=$((attempt * 30))
                echo "Attempt failed; retrying in ${delay}s"
              fi
              sleep "$delay"
            fi
          done

          echo "Edition generation failed after 5 attempts"
          exit 1
